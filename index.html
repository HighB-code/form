<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Intro component with sign up form</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-white font-['Poppins',sans-serif] flex justify-center items-center p-2 lg:p-0">

  <section class="mx-auto w-full max-w-sm bg-[hsl(0,100%,74%)] px-6 py-8 flex flex-col justify-center items-center shadow-xl gap-6 lg:max-w-full lg:min-h-screen lg:mx-0 lg:flex-row lg:justify-evenly">

  <!-- flyer/intro section -->
  <div class="flex flex-col justify-center items-center p-4 text-white gap-6 text-[hsl(246,25%,77%)] text-center lg:h-[200px]">
  <h1 class="w-[240px] text-2xl tracking-wide [word-spacing:0.2rem] font-bold lg:text-4xl lg:w-[500px] lg:text-start">
  Learn to code by watching others
  </h1>

<p class="leading-6 opacity-70 text-xs text-center w-full font-medium lg:text-base lg:w-[500px] lg:text-start"> See how experienced developers solve problems in real-time. Watching scripted tutorials is great, but understanding how developers think is invaluable. </p>
</div>

<!-- form section -->
<div class="w-full flex flex-col gap-6 lg:justify-between lg:w-2/5">
<button class="bg-[hsl(248,32%,49%)] px-6 py-2 rounded-lg text-white text-sm tracking-wide text-[hsl(246,25%,77%)] leading-6 lg:w-4/5 lg:py-4">Try it free 7 days <span class="opacity-70 shadow-xl">then $20/mo. thereafter</span></button>

<form class="w-full p-3 flex flex-col gap-4 bg-white rounded-lg shadow-xl lg:w-4/5 lg:p-6 lg:gap-8">

    <input class="block lg:hidden sm:hidden border border-black/10 px-6 py-4 rounded-sm text-sm font-semibold lg:caret-purple-700 focus:boder-purple-700" type="text" id="firstName" name="firstName" placeholder="First Name" required>

    <input class="hidden lg:block border px-6 py-4 rounded-sm text-sm font-semibold border-black/20" type="text" id="firstName" name="firstName" placeholder="Jonathan" required>

    <input class="border border-black/20 px-6 py-4 rounded-lg text-sm font-semibold" type="text" id="lastName" name="lastName" placeholder="Last Name" required>

    <input class="border border-black/20 px-6 py-4 rounded-lg text-sm font-semibold" type="email" id="email" name="email" placeholder="Email Address" required>

    <input class="border border-black/20 px-6 py-4 rounded-lg text-sm font-semibold" type="password" id="password" name="password" placeholder="Password" required>
  
    <button class="bg-[hsl(154,59%,51%)] px-6 py-4 rounded-lg text-base font-light text-sm text-white uppercase tracking-wide shadow-xl hover:cursor-pointer" type="submit">Claim your free trial </button>

    <div class="flex flex-col leading-5 justify-center items-center text-center p-2">
      <p class="text-xs font-light text-grey-100 opacity-70">By clicking the button, you are agreeing to our <span class="text-[hsl(0,100%,74%)] font-medium">Terms and Services</span></p>
    </div>

  
</form>
</div>


</section>
</body>
</html>
